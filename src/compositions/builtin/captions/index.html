<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=1920,height=1080"><title>Captions</title><script src="cutroom:gsap"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}*{box-sizing:border-box}#stage{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:Arial,sans-serif;color:white;transform-origin:top left}.clip{position:absolute;inset:0}.editable{font-family:var(--font,Arial,sans-serif);font-size:calc(var(--font-size,96)*1px);font-weight:var(--weight,600);color:var(--color,#ffffff);text-align:var(--align,center);white-space:pre-wrap;overflow-wrap:anywhere}.text-box{position:absolute;left:calc(var(--x,0.1)*100%);top:calc(var(--y,0.38)*100%);width:calc(var(--w,0.8)*100%);height:calc(var(--h,0.3)*100%);display:grid;align-content:center;margin:0}.subtitle{position:absolute;top:65%;left:10%;width:80%;margin:0}.lower{position:absolute;left:7%;bottom:10%;max-width:80%;padding:28px 40px;background:var(--background,#162332);border-left:8px solid var(--accent,#9cc8ef)}.lower h1,.lower p{margin:0}.lower p{font-size:36px;margin-top:12px}.caption{position:absolute;left:10%;bottom:10%;width:80%;display:flex;justify-content:center;flex-wrap:wrap;gap:0.22em;font-size:64px;line-height:1.3;text-align:center;font-weight:600;text-shadow:0 2px 6px #000}.caption span{display:inline-block}.caption[data-prop-preset="Bold pop"]{font-size:84px;font-weight:800}.caption[data-prop-preset="Bold pop"] .active{color:var(--highlight,#f6d36d);scale:1.08}.caption[data-prop-preset="Karaoke"] .active{color:var(--highlight,#f6d36d)}.caption[data-prop-preset="Boxed"]{background:#162332;padding:20px;border-radius:12px}</style></head><body><main id="stage" data-composition-id="captions" data-start="0" data-duration="5" data-width="1920" data-height="1080"><section class="clip" data-start="0" data-duration="5" data-track-index="0"><div data-cut-id="captions" class="caption" data-prop-preset="Clean" data-prop-words="[]"></div></section></main><script>window.__timelines=window.__timelines||{};const tl=gsap.timeline({paused:true});tl.fromTo('.clip',{opacity:0},{opacity:1,duration:.3,ease:'power2.out'},0);tl.to({},{duration:5},0);window.__timelines['captions']=tl;let words=[];window.__cutroomProps=function(values){const data=values.captions||{};try{const parsed=JSON.parse(data.words||'[]');words=Array.isArray(parsed)?parsed.filter(w=>typeof w.text==='string'&&Number.isFinite(w.start)&&Number.isFinite(w.end)):[];}catch{words=[];}const root=document.querySelector('[data-cut-id="captions"]');root.replaceChildren(...words.map(w=>{const s=document.createElement('span');s.textContent=w.text;return s;}));};window.__cutroomSeek=function(time){const root=document.querySelector('[data-cut-id="captions"]');Array.from(root.children).forEach((node,i)=>{const w=words[i];node.classList.toggle('active',!!w&&time>=w.start&&time<w.end);});};</script></body></html>
